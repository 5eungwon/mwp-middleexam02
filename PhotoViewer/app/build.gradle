plugins { id 'com.android.application' }

android {
    namespace 'kr.ac.homeguard.photoviewer'
    compileSdk 36
    defaultConfig {
        applicationId 'kr.ac.homeguard.photoviewer'
        minSdk 27
        targetSdk 36
        versionCode 1
        versionName '1.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    buildTypes { release { minifyEnabled false } }
}
